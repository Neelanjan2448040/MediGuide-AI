        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#1E88E5", "font": {"color": "#E0E0E0"}, "id": "Dengue", "label": "Dengue", "shape": "dot"}, {"color": "#D81B60", "font": {"color": "#E0E0E0"}, "id": "Fever", "label": "Fever", "shape": "dot"}, {"color": "#43A047", "font": {"color": "#E0E0E0"}, "id": "Paracetamol", "label": "Paracetamol", "shape": "dot"}, {"color": "#FB8C00", "font": {"color": "#E0E0E0"}, "id": "Diabetes", "label": "Diabetes", "shape": "dot"}, {"color": "#5E35B1", "font": {"color": "#E0E0E0"}, "id": "High Blood Sugar", "label": "High Blood Sugar", "shape": "dot"}, {"color": "#1E88E5", "font": {"color": "#E0E0E0"}, "id": "Insulin", "label": "Insulin", "shape": "dot"}, {"color": "#D81B60", "font": {"color": "#E0E0E0"}, "id": "Hypertension", "label": "Hypertension", "shape": "dot"}, {"color": "#43A047", "font": {"color": "#E0E0E0"}, "id": "Dizziness", "label": "Dizziness", "shape": "dot"}, {"color": "#FB8C00", "font": {"color": "#E0E0E0"}, "id": "COVID-19", "label": "COVID-19", "shape": "dot"}, {"color": "#5E35B1", "font": {"color": "#E0E0E0"}, "id": "Cough", "label": "Cough", "shape": "dot"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#546E7A", "from": "Dengue", "label": "causes symptom", "to": "Fever"}, {"arrows": "to", "color": "#546E7A", "from": "Dengue", "label": "treated with", "to": "Paracetamol"}, {"arrows": "to", "color": "#546E7A", "from": "Diabetes", "label": "characterized by", "to": "High Blood Sugar"}, {"arrows": "to", "color": "#546E7A", "from": "Diabetes", "label": "managed with", "to": "Insulin"}, {"arrows": "to", "color": "#546E7A", "from": "Hypertension", "label": "symptom", "to": "Dizziness"}, {"arrows": "to", "color": "#546E7A", "from": "COVID-19", "label": "symptom", "to": "Cough"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"barnesHut": {"gravitationalConstant": -1000, "centralGravity": 0.5, "springLength": 80}, "minVelocity": 0.75, "stabilization": {"enabled": true, "iterations": 100}}, "interaction": {"zoomView": false, "dragView": false, "dragNodes": true}};
